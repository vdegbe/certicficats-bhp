const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function show(raw){
  const ck=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},ck,d(P.c));
  const html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  for(const e of E){let raw;
    try{
      const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(e.s),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
      raw=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:d(e.i)},k,d(e.w)));
    }catch(x){continue}
    try{sessionStorage.setItem("ck",btoa(String.fromCharCode(...raw)))}catch(x){}
    return show(raw);
  }
  throw new Error("mot de passe");
}
async function go(pw){
  const e=document.getElementById("e");e.textContent="Vérification…";
  try{await open_(pw)}catch(x){e.textContent="Mot de passe incorrect."}
}
document.getElementById("f").onsubmit=ev=>{ev.preventDefault();go(document.getElementById("p").value.trim().toLowerCase())};
